{title:'Prvé ráno na HR',sub:'Zisti, prečo spoločnosť NOVA stratila kontrolu nad ľuďmi.',accent:'#75e0ce',points:10, time:'8–10 min',evidence:'Personálny manažment prepája ciele firmy s potrebami, schopnosťami a rozvojom ľudí.',stations:[
 st('r1a','Správa od riaditeľa','Ujasni si, čo vlastne HR riadi.',[

 P('Ktorá odpoveď vystihuje hlavný zmysel personálneho manažmentu?', ['Zabezpečiť ciele organizácie prostredníctvom vhodného získavania, využívania a rozvoja ľudí.','Sústrediť sa výlučne na administratívu miezd a dochádzky.','Prenechať zodpovednosť za ľudí len vedúcim výroby.','Zvyšovať počet zamestnancov bez ohľadu na potrebu firmy.'],'Zabezpečiť ciele organizácie prostredníctvom vhodného získavania, využívania a rozvoja ľudí.','Personálny manažment zahŕňa získavanie, rozvoj, motivovanie i efektívne využívanie ľudí.'),
 M('Vyber TRI rozumné reakcie HR na e-mail riaditeľa.', ['Overiť, či problém súvisí s kapacitami, schopnosťami alebo organizáciou práce.','Zistiť od vedúcich tímov, aké prekážky bránia výkonu.','Vybrať riešenie podľa zistení a následne overiť jeho účinok.','Automaticky objednať najdrahšie školenie.','Prijať ďalších desať ľudí bez analýzy.','Zrušiť hodnotenie zamestnancov, aby nemali stres.'], ['Overiť, či problém súvisí s kapacitami, schopnosťami alebo organizáciou práce.','Zistiť od vedúcich tímov, aké prekážky bránia výkonu.','Vybrať riešenie podľa zistení a následne overiť jeho účinok.'],'Problém sa najskôr diagnostikuje; riešenie má reagovať na príčinu, nie na domnienku.')], 'Premýšľaj, čím sa líši cieľ HR od jednej konkrétnej HR činnosti.','HR nerovná sa iba nábor ani školenia.',7),
 st('r1b','Zápisnica vedenia','Zisti, či sa rozhodnutia robia systematicky.',[
 ['Pondelok','Vedúca prijala troch nových pracovníkov len preto, že sa sťažoval tím. O týždeň nevedela, kam ich zaradiť.'],

 A('Priraď zásah k tomu, čo musí HR predovšetkým posúdiť.',[
 ['Nová pozícia, ktorej povinnosti nik nevysvetlil','Analýza pracovného miesta'],['Prijatie ľudí bez overenia potreby','Personálne plánovanie'],['Pracovníčka presunutá medzi oddeleniami','Rozmiestňovanie pracovníkov'],['Zamestnanci sa nevedia zlepšovať','Vzdelávanie a rozvoj']],'Jedna situácia môže súvisieť s viacerými činnosťami; hľadaj tú, ktorá je pre riešenie primárna.'),
 P('Čo je spoločným problémom oboch rozhodnutí?', ['Rozhodovanie bez koordinácie a informácií o pracovných miestach a kapacitách.','Príliš nízka úroveň tímových benefitov.','Nadmerný počet personálnych ukazovateľov.','Nedostatok pracovných inzerátov.'],'Rozhodovanie bez koordinácie a informácií o pracovných miestach a kapacitách.','Efektívne využívanie ľudí vyžaduje koordináciu, nielen rýchlu reakciu.')], 'K správnemu priradeniu sa dostaň cez hlavný problém, nie cez jedno slovo v situácii.','Rozhodnutia o ľuďoch musia mať spoločnú logiku.',2),
 st('r1c','Konflikt priorít','Vedenie žiada výsledky hneď; zamestnanci hovoria o preťažení.',[

 P('Ktorý prvý krok je najlepšie obhájiteľný?', ['Porovnať požadované výsledky s disponibilnými ľuďmi a ich kompetenciami.','Zvýšiť tlak na nadčasy bez časového obmedzenia.','Vyhlásiť plošný nábor na všetky oddelenia.','Odložiť diskusiu so zamestnancami až po skončení roka.'],'Porovnať požadované výsledky s disponibilnými ľuďmi a ich kompetenciami.','Bez znalosti rozdielu medzi potrebou a stavom nevieme zvoliť primerané opatrenie.'),
 M('Čo je potrebné zohľadniť pri posudzovaní ľudských zdrojov? Označ TRI prvky.', ['Počet ľudí v relevantných tímoch.','Schopnosti a pracovné skúsenosti.','Motiváciu a pripravenosť na zmeny.','Firemné výdavky na reprezentáciu bez väzby na kapacity.','Mieru spokojnosti zákazníkov bez rozlíšenia príčiny.','Minuloročný návrh personálneho stavu bez aktualizácie.'],['Počet ľudí v relevantných tímoch.','Schopnosti a pracovné skúsenosti.','Motiváciu a pripravenosť na zmeny.'],'Personálne plánovanie nepracuje iba s počtom osôb; rieši aj kvalitu a pripravenosť pracovnej sily.')], 'Vyber fakty, bez ktorých nevieme rozhodnúť o personálnych kapacitách.','Výkon organizácie závisí od počtu, kompetencií aj podmienok ľudí.',9),
 st('r1d','Etický filter','Sťažnosti zamestnancov sa nesmú stať iba číslom v reportingu.',[

 P('Čo by bolo slabým ukazovateľom úspešnosti prijatého opatrenia?', ['Len počet rozposlaných interných e-mailov.','Miera opakovania problémov v rozpisovaní.','Spätná väzba zamestnancov po zmene.','Zmeny absencie alebo fluktuácie v dotknutom tíme.'],'Len počet rozposlaných interných e-mailov.','Vykonaná aktivita nie je to isté ako jej reálny účinok.')], 'Odlišuj aktivitu od výsledku a komunikáciu od dôvery.','Dôveryhodné HR overuje dopad svojich rozhodnutí.',4),

function shuffle(xs,label){let a=[...xs],rand=randomFor(label);for(let i=a.length-1;i>0;i--){let j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function room(){state.phase='game';let i=state.room,r=ROOMS[i],assign=shuffle(r.stations.map(s=>s.id),'room-objects-'+i);const ready=roomDone(i);const digits=r.stations.map(s=>state.done[s.id]?s.digit:null);let roomScore=r.stations.reduce((n,s)=>n+(state.done[s.id]?.points||0),0);app.innerHTML=header()+`<div class="hud"><div><div class="kicker">Miestnosť ${i+1} / 6 · ${r.time}</div><h2>${esc(r.title)}</h2><p>${esc(r.sub)}</p></div><div class="counters"><div class="counter"><strong>${score()} / ${MAX_POINTS}</strong><span>Body</span></div><div class="counter"><strong>${count()} / 30</strong><span>Vyriešené</span></div><div class="counter"><strong id="clock">${seconds(state.elapsed)}</strong><span>Herný čas</span></div></div></div><div class="progress"><div style="width:${count()/30*100}%"></div></div><div class="sceneCard">${sceneSvg(i)}<div class="sceneHeader"><p>Ťukni na zvýraznené predmety. Po splnení všetkých piatich zostav kód podľa čísel indícií.</p><button class="smallbtn" data-action="guide">Pravidlá hry</button></div></div><div class="stations">${assign.map((id,n)=>{const s=stationIndex.get(id).station,d=state.done[id];return `<button class="station ${d?'done':''}" data-station="${n}"><small>${d?'✓ Vyriešené':'◌ Stanovište '+(n+1)}</small><strong>${esc(s.title)}</strong></button>`}).join('')}</div><div class="underScene"><section class="notesBox"><h3>Zápisník indícií <span style="color:${r.accent}">· ${roomScore}/${r.points} b.</span></h3><p>${esc(r.evidence)}</p><div class="lockedSlots">${digits.map((d,n)=>`<div class="slot ${d!==null?'has':''}" title="Indícia ${n+1}">${d===null?'?':d}</div>`).join('')}</div><p class="log">${ready?'Všetky indície nájdené. Kód zadávaj zľava doprava.':'Každé splnené stanovište odhalí jednu číslicu kódu. Môžeš skúmať predmety v ľubovoľnom poradí.'}</p></section><section class="doorBox"><h3>${ready?'Dvere pripravené na odomknutie':'Bezpečnostný zámok'}</h3><p>${ready?'Zadaj päť číslic v poradí 1–5.':'Najprv preskúmaj všetkých päť predmetov. Zámok zatiaľ nereaguje.'}</p><div class="row"><input id="doorCode" maxlength="5" inputmode="numeric" pattern="[0-9]*" placeholder="•••••" aria-label="Päťmiestny kód" ${ready?'':'disabled'}><button class="primary" data-action="unlock" ${ready?'':'disabled'}>Odomknúť</button></div><p class="statusline" id="doorStatus" aria-live="polite">${esc(message)}</p></section></div><div class="bottom"><span class="muted">Hra je offline. Postup zostáva iba v tomto prehliadači; nič sa nikam neposiela.</span><button class="smallbtn" data-action="reset">Nová hra od začiatku</button></div><div class="footer">NOVA · Výuková simulácia pre predmet Personálny manažment I.</div>`;message='';}
function feedbackFooter(id,step){const w=getWork(id),stn=stationIndex.get(id).station,hinted=w.hinted.includes(step);return `<div class="helpbar"><div><button class="hintButton" data-action="hint" ${hinted?'disabled':''}>${hinted?'Nápoveda použitá':'Zobraziť nápovedu (−1 b.)'}</button></div><button class="primary" data-action="submit">Overiť odpoveď →</button></div>${hinted?`<div class="hintbox"><b>Nápoveda:</b> ${esc(stn.tip)}</div>`:''}<div class="muted" style="margin-top:12px">Nesprávny pokus: −1 bod. Po troch omyloch v jednom kroku sa dá riešenie odkryť za 0 bodov z úlohy.</div>`;}
function openStation(id){if(state.done[id]){active=id;draft=null;docTab=0;stepFeedback={completed:true};drawModal();return;}active=id;docTab=0;draft={};stepFeedback=null;getWork(id);drawModal();}
function prepareDraft(t,id,step){if(draft&&draft._id===id&&draft._step===step)return;draft={_id:id,_step:step,pick:null,multi:[],match:{},ordered:[]};}
function drawQuestion(t,id,step){prepareDraft(t,id,step);
 if(t.type==='pick')return `<div class="optionList">${shuffle(t.options,id+'-'+step+'-choices').map(x=>`<button class="opt ${draft.pick===x?'selected':''}" aria-pressed="${draft.pick===x}" data-pick="${esc(x)}"><span class="tick">${draft.pick===x?'✓':''}</span><span>${esc(x)}</span></button>`).join('')}</div>`;
 if(t.type==='multi')return `<p class="taskInfo">Označ presne ${t.answers.length} možnosti. Poradie nehrá úlohu.</p><div class="optionList">${shuffle(t.options,id+'-'+step+'-multi').map(x=>`<button class="opt ${draft.multi.includes(x)?'selected':''}" aria-pressed="${draft.multi.includes(x)}" data-multi="${esc(x)}"><span class="tick">${draft.multi.includes(x)?'✓':''}</span><span>${esc(x)}</span></button>`).join('')}</div>`;
 if(t.type==='match')return `<p class="taskInfo">Pre každý prípad vyber najvýstižnejšiu možnosť. Niektoré možnosti môžu správne zodpovedať viacerým prípadom.</p>${shuffle(t.pairs,id+'-'+step+'-matchrows').map(([left],n)=>`<div class="pairRow"><label for="match-${n}">${esc(left)}</label><select id="match-${n}" data-match="${esc(left)}"><option value="">Vyber správnu charakteristiku…</option>${shuffle([...new Set(t.pairs.map(y=>y[1]))],id+'-'+step+'-matchoptions').map(y=>`<option ${draft.match[left]===y?'selected':''} value="${esc(y)}">${esc(y)}</option>`).join('')}</select></div>`).join('')}`;
 if(t.type==='sort'){let candidates=shuffle(t.items,id+'-'+step+'-sort').filter(x=>!draft.ordered.includes(x));return `<p class="taskInfo">Klikaj na jednotlivé kroky v správnom poradí. Zvolený krok môžeš vrátiť kliknutím na jeho položku vpravo.</p><div class="sortPanels"><div><h4>Zostávajúce kroky</h4>${candidates.length?candidates.map(x=>`<button class="sortOption" data-add="${esc(x)}">＋ ${esc(x)}</button>`).join(''):'<p class="muted">Všetky kroky sú usporiadané.</p>'}</div><div><h4>Tvoje poradie</h4>${draft.ordered.map((x,n)=>`<button class="sortChosen" data-remove="${esc(x)}"><span class="sortNum">${n+1}</span>${esc(x)}</button>`).join('')||'<p class="muted">Začni výberom prvého kroku.</p>'}</div></div>`;}
 return '';
}
function answerText(t){
 if(t.type==='pick')return t.answer;
 if(t.type==='multi')return t.answers.join(' • ');
 if(t.type==='match')return t.pairs.map(([a,b])=>a+' → '+b).join(' | ');
 if(t.type==='sort')return t.items.map((x,i)=>(i+1)+'. '+x).join(' → ');
 return '';
}
function drawModal(){if(!active){modalroot.innerHTML='';return;}const info=stationIndex.get(active),s=info.station,w=getWork(active),completed=!!state.done[active];const bodyCompleted=completed&&(stepFeedback?.completed);
 let main='';if(bodyCompleted){let d=state.done[active];let note=d.skipped?`<div class="hintbox"><b>Odkryté riešenie:</b> ${esc(answerText(s.steps[Math.min(w.step,s.steps.length-1)]))}<p style="margin:7px 0 0">${esc(s.steps[Math.min(w.step,s.steps.length-1)].why)}</p></div>`:'';main=`<div class="success"><h3>${d.skipped?'Stanovište odomknuté s pomocou':'Stanovište je vyriešené'}</h3><p>${esc(s.summary)}</p>${note}<div class="token"><span>Indícia ${info.pos+1}/5 · bodov získaných: ${d.points}</span><strong>${s.digit}</strong></div><button class="primary" data-action="close">Späť do kancelárie</button></div>`;}
 else if(stepFeedback&&stepFeedback.status==='correct'){let end=w.step===s.steps.length-1;main=`<div class="success"><div class="kicker">Správny postup</div><h3>${end?'Posledná časť je vyriešená':'Dôkaz bol prijatý'}</h3><p>${esc(stepFeedback.why)}</p><p class="muted">${end?'Za dokončené stanovište získaš indíciu do bezpečnostného kódu.':'Teraz prejdi na ďalšiu časť prípadu.'}</p><button class="primary" data-action="nextStep">${end?'Získať indíciu':'Pokračovať na druhý krok'} →</button></div>`;}
 else {let t=s.steps[w.step];main=`<div class="stepLabel">Krok ${w.step+1} z ${s.steps.length} · Hodnota stanovišťa ${ROOMS[info.room].points/5} b.</div><div class="question">${esc(t.prompt)}</div>${drawQuestion(t,active,w.step)}${feedbackFooter(active,w.step)}${stepFeedback?.status==='wrong'?`<div class="statusbox" role="alert">${esc(stepFeedback.text)}</div>`:''}${w.stepWrong>=3?`<div class="statusbox">Ak sa nedarí, môžeš pokračovať s vysvetlením. Za toto stanovište potom nezískaš žiadne body.<div class="buttons"><button class="secondary" data-action="reveal">Odkryť riešenie a získať indíciu (0 b.)</button></div></div>`:''}`;}
 const docs=s.docs.map(([name],n)=>`<button class="docTab ${docTab===n?'current':''}" data-doc="${n}">${esc(name)}</button>`).join('');
 modalroot.innerHTML=`<div class="modal" role="presentation"><section role="dialog" aria-modal="true" aria-label="${esc(s.title)}" class="dialog"><div class="dialogTop"><div><div class="kicker" style="margin:0 0 6px">Miestnosť ${info.room+1} · Spis ${info.pos+1}/5</div><h2>${esc(s.title)}</h2><p>${esc(s.brief)}</p></div><button class="close" aria-label="Zatvoriť úlohu" data-action="close">×</button></div><div class="dialogMain"><div class="docs"><div class="docTabs">${docs}</div><div class="docContent">${esc(s.docs[docTab][1])}</div></div>${main}</div></section></div>`;
 const d=modalroot.querySelector('.dialog');if(d)d.scrollTop=0;}
function refreshQuestion(){if(!active)return;drawModal();}
function clearDraft(){draft=null;stepFeedback=null;}
function compareArrays(a,b){return a.length===b.length&&a.every((x,i)=>x===b[i]);}
function validAnswer(t){if(t.type==='pick')return draft.pick===t.answer;
 if(t.type==='multi')return draft.multi.length===t.answers.length&&t.answers.every(x=>draft.multi.includes(x));
 if(t.type==='match')return t.pairs.every(([l,r])=>draft.match[l]===r);
 if(t.type==='sort')return compareArrays(draft.ordered,t.items);
 return false;}
function hasCompleteAnswer(t){if(t.type==='pick')return draft.pick!==null;
 if(t.type==='multi')return draft.multi.length===t.answers.length;
 if(t.type==='match')return t.pairs.every(([l])=>!!draft.match[l]);
 if(t.type==='sort')return draft.ordered.length===t.items.length;
 return false;}
function submit(){if(!active||stepFeedback?.status==='correct'||state.done[active])return;let s=stationIndex.get(active).station,w=getWork(active),t=s.steps[w.step];if(!hasCompleteAnswer(t)){stepFeedback={status:'wrong',text:'Odpoveď ešte nie je kompletná. Doplň všetky povinné časti a skús ju overiť.'};drawModal();return;}
 if(validAnswer(t)){stepFeedback={status:'correct',why:t.why};}else{w.mistakes++;w.stepWrong++;stepFeedback={status:'wrong',text:`Riešenie nezodpovedá všetkým dôkazom. Over informácie v dokumentoch, porovnaj možnosti a oprav svoju odpoveď. ${w.stepWrong>=3?'Teraz môžeš odkryť riešenie, ak si nevieš rady.':'Nezabudni, že niektoré voľby znejú podobne.'}`};save();}drawModal();}
function finishStation(skip=false){let info=stationIndex.get(active),s=info.station,w=getWork(active);let points=skip?0:Math.max(0,ROOMS[info.room].points/5 - w.mistakes-w.hintCount);state.done[active]={points,mistakes:w.mistakes,hints:w.hintCount,skipped:skip};save();stepFeedback={completed:true};draft=null;drawModal();}
function nextStep(){if(!active||stepFeedback?.status!=='correct')return;let w=getWork(active),s=stationIndex.get(active).station;if(w.step>=s.steps.length-1){finishStation(false);}else{w.step++;w.stepWrong=0;clearDraft();save();drawModal();}}
function hint(){if(!active||stepFeedback?.status==='correct')return;let w=getWork(active);if(w.hinted.includes(w.step))return;w.hinted.push(w.step);w.hintCount++;save();drawModal();}
function reveal(){if(!active)return;let w=getWork(active);if(w.stepWrong<3)return;finishStation(true);}
function unlock(){const r=state.room;if(!roomDone(r))return;let el=document.getElementById('doorCode');if(!el)return;const entered=el.value.trim();let status=document.getElementById('doorStatus');if(entered!==code(r)){status.textContent='Tento kód dvere neotvoril. Skontroluj poradie indícií 1 až 5.';status.style.color='#ffc4b8';return;}
 state.opened[r]=true;state.room++;message='';if(state.room>=ROOMS.length){state.phase='finished';save();endScreen();}else{save();room();window.scrollTo(0,0);}}
function endScreen(){state.phase='finished';save();app.innerHTML=header()+`<main class="finish"><div class="medal" aria-hidden="true">✦</div><div class="kicker">Bezpečnostný protokol obnovený</div><h1>Únik bol <em>úspešný.</em></h1><p>Otvoril(a) si všetkých šesť miestností a pomohol(a) spoločnosti NOVA znovu postaviť personálne rozhodovanie na systematickom plánovaní, údajoch a ľudskom prístupe.</p><div class="finalRow"><div class="finalMetric"><strong>${score()} / 100</strong><span>Tvoje body</span></div><div class="finalMetric"><strong>${count()} / 30</strong><span>Stanovištia</span></div><div class="finalMetric"><strong>${seconds(state.elapsed)}</strong><span>Čas v hre</span></div></div><p><strong>Hra je ukončená.</strong> Nie je potrebné nič posielať vyučujúcej ani vypĺňať formuláre. Tieto údaje sa nikam neodosielajú.</p><div class="buttons" style="justify-content:center"><button class="primary" data-action="reset">Zahrať znova</button></div></main><div class="footer">Ing. Kristína Kozová, PhD. · Personálny manažment I.</div>`;modalroot.innerHTML='';}
function start(){if(state.phase==='finished'){endScreen();return;}state.phase='game';save();room();}
function guide(){modalroot.innerHTML=`<div class="modal"><section role="dialog" aria-modal="true" aria-label="Pravidlá" class="dialog"><div class="dialogTop"><div><div class="kicker" style="margin:0 0 6px">Pokyny</div><h2>Pravidlá únikovej hry</h2></div><button class="close" data-action="closeGuide" aria-label="Zatvoriť">×</button></div><div class="dialogMain"><p>Preskúmaj všetkých päť predmetov v každej miestnosti. Každý otvára personálny prípad so <strong>dvoma nadväzujúcimi krokmi</strong>. Môžeš prepínať medzi dokumentmi a vrátiť sa k rozpracovanej úlohe.</p><p>Pri výberových a priraďovacích úlohách sú možnosti premiešané. Pri zoraďovaní klikaj postupne na jednotlivé kroky; zvolený krok môžeš kliknutím vrátiť.</p><p>Za chybu alebo nápovedu sa odpočítava po jednom bode z hodnoty daného stanovišťa. Minimálne skóre stanovišťa je nula. Po troch nesprávnych pokusoch v jednom kroku môžeš odkryť riešenie, získať indíciu a pokračovať.</p><p>Po piatich prípadoch poskladaj číselný kód podľa označenia indícií 1–5 a otvor dvere. Hra nevyžaduje meno, prihlásenie ani internet. Bodovanie je len pre tvoju osobnú spätnú väzbu.</p><div class="buttons"><button class="primary" data-action="closeGuide">Rozumiem</button></div></div></section></div>`;}
function reset(){if(!confirm('Naozaj chceš začať novú hru? Doterajší postup v tomto prehliadači sa vymaže.'))return;state=initial();active=null;draft=null;stepFeedback=null;modalroot.innerHTML='';save();intro();window.scrollTo(0,0);}
app.addEventListener('click',e=>{const obj=e.target.closest('[data-station]');if(obj){let i=Number(obj.getAttribute('data-station')),ids=shuffle(ROOMS[state.room].stations.map(s=>s.id),'room-objects-'+state.room);openStation(ids[i]);return;}if(e.target.closest('[data-door]')){document.getElementById('doorCode')?.focus();if(!roomDone(state.room))document.getElementById('doorStatus').textContent='Najprv preskúmaj všetkých päť objektov.';return;}const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return; if(a==='start')start(); if(a==='unlock')unlock(); if(a==='guide')guide(); if(a==='reset')reset();});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-station],[data-door]')){e.preventDefault();e.target.click();}if(e.key==='Enter'&&e.target.id==='doorCode'){e.preventDefault();unlock();}});
modalroot.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;const a=b.dataset.action;
 if(a==='close'){active=null;clearDraft();modalroot.innerHTML='';room();return;}if(a==='closeGuide'){modalroot.innerHTML='';return;}
 if(a==='submit'){submit();return;}if(a==='nextStep'){nextStep();return;}if(a==='hint'){hint();return;}if(a==='reveal'){reveal();return;}
 if(b.hasAttribute('data-doc')){docTab=Number(b.dataset.doc);drawModal();return;}
 if(!active||state.done[active]||stepFeedback?.status==='correct')return;
 if(b.hasAttribute('data-pick')){draft.pick=b.dataset.pick;stepFeedback=null;refreshQuestion();return;}
 if(b.hasAttribute('data-multi')){let x=b.dataset.multi;draft.multi=draft.multi.includes(x)?draft.multi.filter(y=>y!==x):[...draft.multi,x];stepFeedback=null;refreshQuestion();return;}
 if(b.hasAttribute('data-add')){draft.ordered.push(b.dataset.add);stepFeedback=null;refreshQuestion();return;}
 if(b.hasAttribute('data-remove')){draft.ordered=draft.ordered.filter(x=>x!==b.dataset.remove);stepFeedback=null;refreshQuestion();return;}
});
modalroot.addEventListener('change',e=>{if(e.target.matches('[data-match]')&&draft){draft.match[e.target.dataset.match]=e.target.value;stepFeedback=null;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalroot.children.length){if(active){active=null;clearDraft();modalroot.innerHTML='';room();}else{modalroot.innerHTML='';}}});
setInterval(()=>{if(state&&state.phase==='game'&&!document.hidden){state.elapsed++;let el=document.getElementById('clock');if(el)el.textContent=seconds(state.elapsed);if(state.elapsed%15===0)save();}},1000);
state=read();if(state.phase==='finished'||state.room>=6)endScreen();else if(state.phase==='game')room();else intro();

</script>
</body>
</html>
